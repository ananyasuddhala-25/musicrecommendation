<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: linear-gradient(120deg, #a18cd1 0%, #fbc2eb 100%); font-family: Arial, sans-serif; margin:0; }
        .navbar { background: #6a3093; }
        .navbar-brand, .nav-link, .navbar-text { color: #fff !important; }
        .section { display: none; padding: 32px 0; }
        .section.active { display: block; }
        .song-list audio { width: 180px; }
        .song-list .btn { margin-left: 8px; }
        .moodbot-chat { max-height: 260px; overflow-y: auto; background: #f4f4f4; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .story-anim { min-height: 120px; background: #e3d3f7; border-radius: 8px; padding: 16px; margin: 16px 0; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" id="nav-home">MusicMood</a>
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="#" id="nav-songs">Songs</a></li>
            <li class="nav-item"><a class="nav-link" href="#" id="nav-favorites">Favorite Songs</a></li>
            <li class="nav-item"><a class="nav-link" href="#" id="nav-moodbot">MoodBot</a></li>
            <li class="nav-item"><a class="nav-link" href="#" id="nav-story">Story Engine</a></li>
        </ul>
        <span class="navbar-text"><button class="btn btn-outline-light btn-sm" id="logout-btn">Logout</button></span>
    </div>
</nav>

<div class="container">
    <!-- SONGS SECTION -->
    <div class="section active" id="section-songs">
        <h2>Songs</h2>
        <div class="row song-list" id="songs-list"></div>
    </div>

    <!-- FAVORITES SECTION -->
    <div class="section" id="section-favorites">
        <h2>Favorite Songs</h2>
        <div class="row song-list" id="favorites-list"></div>
    </div>

    <!-- MOODBOT SECTION -->
    <div class="section" id="section-moodbot">
        <h2>MoodBot</h2>
        <div class="moodbot-chat" id="moodbot-chat"></div>
        <form id="moodbot-form" class="d-flex mb-2">
            <input class="form-control me-2" id="moodbot-input" placeholder="Type your mood or message...">
            <button class="btn btn-primary" type="submit">Send</button>
        </form>
        <div id="moodbot-recommendations"></div>
    </div>

    <!-- STORY ENGINE SECTION -->
    <div class="section" id="section-story">
        <h2>Story Engine</h2>
        <p>Select songs to generate a story:</p>
        <div class="row song-list" id="story-song-list"></div>
        <button class="btn btn-success mt-2" id="generate-story-btn">Generate Story</button>
        <div class="story-anim" id="story-output"></div>
    </div>
</div>

<script src="dashboard.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
